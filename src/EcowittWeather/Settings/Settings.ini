[Metadata]
Name=Ecowitt Weather Cloud Settings
Author=Martin Šturcel (mpca86)
Information=Configuration panel for Ecowitt Web API v3.
License=Creative Commons BY-NC-SA 3.0
Version=1.10.0-cloud-alpha
Website=https://martinsturcel.sk

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

@IncludeVariables=#@#Includes\Variables.inc
@IncludeCloudSecrets=#@#Includes\CloudSecrets.inc

[Variables]
SettingsStatus=Zadaj Cloud API údaje a potvrď ich Enterom
SettingsStatusColor=255,210,80,255
fontName=Trebuchet MS
colorText=255,255,255,220
colorDim=255,255,255,150
colorGood=120,255,120,255
colorBad=255,100,100,255
colorWarn=255,210,80,255

[MeasureInputApplicationKey]
Measure=Plugin
Plugin=InputText
X=20
Y=72
W=320
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
Password=1
DefaultValue=#EcowittApplicationKey#
Command1=!WriteKeyValue Variables EcowittApplicationKey "$UserInput$" "#@#Includes\CloudSecrets.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1

[MeasureInputApiKey]
Measure=Plugin
Plugin=InputText
X=20
Y=132
W=320
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
Password=1
DefaultValue=#EcowittApiKey#
Command1=!WriteKeyValue Variables EcowittApiKey "$UserInput$" "#@#Includes\CloudSecrets.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1

[MeasureInputMac]
Measure=Plugin
Plugin=InputText
X=20
Y=192
W=210
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
DefaultValue=#EcowittMac#
Command1=!WriteKeyValue Variables EcowittMac "$UserInput$" "#@#Includes\CloudSecrets.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1

[MeasureInputRefresh]
Measure=Plugin
Plugin=InputText
X=250
Y=192
W=90
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
InputNumber=1
InputLimit=4
DefaultValue=#CloudRefreshSeconds#
Command1=!WriteKeyValue Variables CloudRefreshSeconds "$UserInput$" "#@#Includes\Variables.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1

[MeasureTestGate]
Measure=String
String=#EcowittApplicationKey#|#EcowittApiKey#|#EcowittMac#
IfMatch=^.+\|.+\|.+$
IfMatchAction=[!SetVariable SettingsStatus "Testujem Ecowitt Cloud API ..."][!SetVariable SettingsStatusColor "#colorWarn#"][!SetOption MeasureTestRaw URL "#EcowittApiBase#?application_key=#EcowittApplicationKey#&api_key=#EcowittApiKey#&mac=#EcowittMac#&call_back=all&temp_unitid=1&pressure_unitid=3&wind_speed_unitid=7&rainfall_unitid=12&solar_irradiance_unitid=16"][!EnableMeasure MeasureTestRaw][!UpdateMeasure MeasureTestRaw][!UpdateMeter MeterStatus][!Redraw]
IfNotMatchAction=[!SetVariable SettingsStatus "Chýba Application Key, API Key alebo MAC"][!SetVariable SettingsStatusColor "#colorBad#"][!DisableMeasure MeasureTestRaw][!UpdateMeter MeterStatus][!Redraw]
DynamicVariables=1
UpdateDivider=-1

[MeasureTestRaw]
Measure=Plugin
Plugin=WebParser
URL=https://api.ecowitt.net/
RegExp=(?siU)^(.*)$
UpdateRate=1
DynamicVariables=1
Disabled=1
FinishAction=[!UpdateMeasure MeasureConnectionState][!UpdateMeter MeterStatus][!Redraw]

[MeasureConnectionState]
Measure=String
String=[MeasureTestRaw]
IfMatch=(?si)"code"\s*:\s*0.*"data"
IfMatchAction=[!SetVariable SettingsStatus "Pripojené - Ecowitt Cloud API odpovedá"][!SetVariable SettingsStatusColor "#colorGood#"]
IfNotMatchAction=[!SetVariable SettingsStatus "Cloud API test zlyhal - skontroluj kľúče a MAC"][!SetVariable SettingsStatusColor "#colorBad#"]
DynamicVariables=1
Disabled=1

[StyleTitle]
Meter=String
FontFace=#fontName#
FontSize=12
FontWeight=700
FontColor=#colorText#
AntiAlias=1

[StyleLabel]
Meter=String
FontFace=#fontName#
FontSize=9
FontColor=#colorDim#
AntiAlias=1

[StyleValue]
Meter=String
FontFace=#fontName#
FontSize=10
FontColor=#colorText#
AntiAlias=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,360,430,5 | Fill Color 0,0,0,185 | Stroke Color 255,255,255,25

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=180
Y=14
StringAlign=Center
Text=ECOWITT CLOUD API - NASTAVENIA

[MeterApplicationLabel]
Meter=String
MeterStyle=StyleLabel
X=20
Y=48
Text=Application Key

[MeterApplicationBox]
Meter=Shape
Shape=Rectangle 18,70,324,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputApplicationKey "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterApplicationValue]
Meter=String
MeterStyle=StyleValue
X=26
Y=76
Text=••••••••••••••••
LeftMouseUpAction=[!CommandMeasure MeasureInputApplicationKey "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterApiLabel]
Meter=String
MeterStyle=StyleLabel
X=20
Y=108
Text=API Key

[MeterApiBox]
Meter=Shape
Shape=Rectangle 18,130,324,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputApiKey "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterApiValue]
Meter=String
MeterStyle=StyleValue
X=26
Y=136
Text=••••••••••••••••
LeftMouseUpAction=[!CommandMeasure MeasureInputApiKey "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterMacLabel]
Meter=String
MeterStyle=StyleLabel
X=20
Y=168
Text=MAC stanice

[MeterRefreshLabel]
Meter=String
MeterStyle=StyleLabel
X=250
Y=168
Text=Refresh (s)

[MeterMacBox]
Meter=Shape
Shape=Rectangle 18,190,214,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputMac "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterMacValue]
Meter=String
MeterStyle=StyleValue
X=26
Y=196
Text=#EcowittMac#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputMac "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterRefreshBox]
Meter=Shape
Shape=Rectangle 248,190,94,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputRefresh "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterRefreshValue]
Meter=String
MeterStyle=StyleValue
X=256
Y=196
Text=#CloudRefreshSeconds#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputRefresh "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterHint]
Meter=String
MeterStyle=StyleLabel
X=20
Y=228
W=320
H=42
ClipString=2
Text=Každé pole po zadaní potvrď Enterom. MAC zadaj napr. AA:BB:CC:DD:EE:FF.

[MeterSecretsHint]
Meter=String
MeterStyle=StyleLabel
X=20
Y=272
W=320
H=42
ClipString=2
Text=CloudSecrets.inc je lokálny súbor a nesmie sa commitnúť do GitHubu.

[MeterTestButton]
Meter=String
MeterStyle=StyleValue
X=20
Y=320
Text=[ TEST CLOUD API ]
FontColor=#colorWarn#
LeftMouseUpAction=[!UpdateMeasure MeasureTestGate]
MouseActionCursor=1

[MeterStatus]
Meter=String
MeterStyle=StyleValue
X=20
Y=346
W=320
H=36
ClipString=2
Text=#SettingsStatus#
FontColor=#SettingsStatusColor#
DynamicVariables=1

[MeterLoadWeather]
Meter=String
MeterStyle=StyleValue
X=20
Y=386
Text=[ OTVORIŤ METEO SKIN ]
FontColor=#colorGood#
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\Meteo" "Meteo.ini"]
MouseActionCursor=1

[MeterAuthor]
Meter=String
MeterStyle=StyleLabel
X=340
Y=386
StringAlign=Right
Text=Martin Šturcel (mpca86)
