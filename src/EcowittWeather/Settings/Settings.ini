[Metadata]
Name=Ecowitt Weather Settings
Author=Martin Šturcel (mpca86)
Information=First-run and configuration panel for Ecowitt Weather.
License=Creative Commons BY-NC-SA 3.0
Version=1.10.0-alpha
Website=https://martinsturcel.sk

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

@IncludeVariables=#@#Includes\Variables.inc

[Variables]
SettingsStatus=Klikni do poľa a zadaj gateway address
SettingsStatusColor=255,210,80,255
fontName=Trebuchet MS
colorText=255,255,255,220
colorDim=255,255,255,150
colorGood=120,255,120,255
colorBad=255,100,100,255
colorWarn=255,210,80,255

[MeasureInputHost]
Measure=Plugin
Plugin=InputText
X=20
Y=72
W=260
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
DefaultValue=#EcowittHost#
Command1=!WriteKeyValue Variables EcowittHost "$UserInput$" "#@#Includes\Variables.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1

[MeasureInputPort]
Measure=Plugin
Plugin=InputText
X=20
Y=146
W=100
H=24
SolidColor=30,30,30,255
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
DefaultValue=#EcowittPort#
InputNumber=1
InputLimit=5
Command1=!WriteKeyValue Variables EcowittPort "$UserInput$" "#@#Includes\Variables.inc"
Command2=!Refresh #CURRENTCONFIG#
DynamicVariables=1
[MeasureTestGate]
Measure=String
String=#EcowittHost#|#EcowittPort#
IfMatch=^.+\|[0-9]{1,5}$
IfMatchAction=[!SetVariable SettingsStatus "Testujem http://#EcowittHost#:#EcowittPort# ..."][!SetVariable SettingsStatusColor "#colorWarn#"][!SetOption MeasureTestRaw URL "http://#EcowittHost#:#EcowittPort#/get_livedata_info"][!EnableMeasure MeasureTestRaw][!UpdateMeasure MeasureTestRaw][!UpdateMeter MeterStatus][!Redraw]
IfNotMatchAction=[!SetVariable SettingsStatus "Najprv zadaj gateway address a platný port"][!SetVariable SettingsStatusColor "#colorBad#"][!DisableMeasure MeasureTestRaw][!UpdateMeter MeterStatus][!Redraw]
DynamicVariables=1
UpdateDivider=-1

[MeasureTestRaw]
Measure=Plugin
Plugin=WebParser
URL=http://127.0.0.1/
RegExp=(?siU)^(.*)$
UpdateRate=5
DynamicVariables=1
Disabled=1

[MeasureConnectionState]
Measure=String
String=[MeasureTestRaw]
IfMatch=(?si)"common_list".*"debug"
IfMatchAction=[!SetVariable SettingsStatus "Pripojené - Local API odpovedá"][!SetVariable SettingsStatusColor "#colorGood#"][!UpdateMeter MeterStatus][!Redraw]
IfNotMatchAction=[!SetVariable SettingsStatus "Bez odpovede - skontroluj adresu, port a routing/firewall"][!SetVariable SettingsStatusColor "#colorBad#"][!UpdateMeter MeterStatus][!Redraw]
DynamicVariables=1

[StyleTitle]
Meter=String
FontFace=#fontName#
FontSize=12
FontWeight=700
FontColor=#colorText#
AntiAlias=1

[StyleLabel]
Meter=String
FontFace=#fontName#
FontSize=9
FontColor=#colorDim#
AntiAlias=1

[StyleValue]
Meter=String
FontFace=#fontName#
FontSize=10
FontColor=#colorText#
AntiAlias=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,315,5 | Fill Color 0,0,0,185 | Stroke Color 255,255,255,25

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=160
Y=14
StringAlign=Center
Text=ECOWITT WEATHER - NASTAVENIA

[MeterHostLabel]
Meter=String
MeterStyle=StyleLabel
X=20
Y=48
Text=Gateway address

[MeterHostBox]
Meter=Shape
Shape=Rectangle 18,70,264,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputHost "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterHostValue]
Meter=String
MeterStyle=StyleValue
X=26
Y=76
Text=#EcowittHost#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputHost "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterHostHint]
Meter=String
MeterStyle=StyleLabel
X=20
Y=104
Text=Bez http://; po zadaní potvrď Enter, napr. 192.168.1.50

[MeterPortLabel]
Meter=String
MeterStyle=StyleLabel
X=20
Y=124
Text=Port

[MeterPortBox]
Meter=Shape
Shape=Rectangle 18,144,104,28,3 | Fill Color 25,25,25,230 | Stroke Color 255,255,255,45
LeftMouseUpAction=[!CommandMeasure MeasureInputPort "ExecuteBatch 1-2"]
MouseActionCursor=1

[MeterPortValue]
Meter=String
MeterStyle=StyleValue
X=26
Y=150
Text=#EcowittPort#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureInputPort "ExecuteBatch 1-2"]
MouseActionCursor=1
[MeterTestButton]
Meter=String
MeterStyle=StyleValue
X=20
Y=188
Text=[ TEST PRIPOJENIA ]
FontColor=#colorWarn#
LeftMouseUpAction=[!UpdateMeasure MeasureTestGate]
MouseActionCursor=1

[MeterStatus]
Meter=String
MeterStyle=StyleValue
X=20
Y=214
W=280
Text=#SettingsStatus#
FontColor=#SettingsStatusColor#
DynamicVariables=1

[MeterLoadWeather]
Meter=String
MeterStyle=StyleValue
X=20
Y=244
Text=[ OTVORIŤ METEO SKIN ]
FontColor=#colorGood#
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\Meteo" "Meteo.ini"]
MouseActionCursor=1

[MeterWebsite]
Meter=String
MeterStyle=StyleLabel
X=20
Y=284
Text=Web
LeftMouseUpAction=["#ProjectWebsite#"]
MouseActionCursor=1

[MeterGitHub]
Meter=String
MeterStyle=StyleLabel
X=74
Y=284
Text=GitHub
LeftMouseUpAction=["#ProjectGitHub#"]
MouseActionCursor=1

[MeterAuthor]
Meter=String
MeterStyle=StyleLabel
X=300
Y=284
StringAlign=Right
Text=Martin Šturcel (mpca86)
