[Metadata]
Name=Ecowitt Weather Cloud
Author=Martin Šturcel (mpca86)
Information=Ecowitt Weather for Rainmeter using Ecowitt Web API v3. Dynamic sensors, trends, diagnostics and in-skin updates.
License=Creative Commons BY-NC-SA 3.0
Website=https://martinsturcel.sk
Version=1.11.0-beta.6

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureMeteoUpdateCheck "Run"]

@IncludeVariables=#@#Includes\Variables.inc
@IncludeUserVariables=#@#Includes\UserVariables.inc
@IncludeLanguageState=#@#Includes\LanguageState.inc
@IncludeEnglish=#@#Languages\en.inc
@IncludeLocale=#@#Languages\#ResolvedUiLanguage#.inc
@IncludeCloudSecrets=#@#Includes\CloudSecrets.inc

; ==================================================
; MEASURES (SŤAHOVANIE DÁT)
; ==================================================


[MeasureLanguageBootstrap]
Measure=Script
ScriptFile=#@#Scripts\language_bootstrap.lua
UpdateDivider=-1

[MeasureConfigState]
Measure=String
String=#EcowittApplicationKey#|#EcowittApiKey#|#EcowittMac#
IfMatch=^.+\|.+\|.+$
IfMatchAction=[!EnableMeasure MeasureEcowittRaw][!UpdateMeasure MeasureEcowittRaw][!SetVariable V_TitleText "#L_meteo_title#"][!SetVariable V_TitleColor "#colorText#"]
IfNotMatchAction=[!DisableMeasure MeasureEcowittRaw][!SetVariable V_TitleText "#L_meteo_config_required#"][!SetVariable V_TitleColor "#ColorWarning#"]
DynamicVariables=1
UpdateDivider=-1

[MeasureEcowittRaw]
Measure=Plugin
Plugin=WebParser
URL=#EcowittApiBase#?application_key=#EcowittApplicationKey#&api_key=#EcowittApiKey#&mac=#EcowittMac#&call_back=all&temp_unitid=1&pressure_unitid=3&wind_speed_unitid=7&rainfall_unitid=12&solar_irradiance_unitid=16
RegExp=(?siU)^(.*)$
UpdateRate=#CloudRefreshSeconds#
DynamicVariables=1
Disabled=1

[ScriptJSON]
Measure=Script
ScriptFile=#@#Scripts\main_cloud.lua


; ==================================================
; AUTOMATICKÁ KONTROLA AKTUALIZÁCIÍ
; Pri štarte a následne každých #UpdateCheckSeconds# sekúnd.
; ==================================================

[MeasureMeteoUpdateCheck]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\updater.ps1" -Action Check -Channel "#UpdateChannel#" -SkinPath "#ROOTCONFIGPATH#." -Repository "#UpdateRepository#" -DevelopmentBranch "#UpdateDevelopmentBranch#" -CurrentVersion "#SkinVersion#"
State=Hide
OutputType=UTF8
FinishAction=[!UpdateMeasure MeasureMeteoUpdateResult][!UpdateMeasure MeasureMeteoUpdateVersion][!UpdateMeter MeterUpdateBadge][!Redraw]
DynamicVariables=1

[MeasureMeteoUpdateResult]
Measure=String
String=[MeasureMeteoUpdateCheck]
IfMatch=^UPDATE\|
IfMatchAction=[!ShowMeter MeterUpdateBadge]
IfNotMatchAction=[!HideMeter MeterUpdateBadge]
DynamicVariables=1

[MeasureMeteoUpdateVersion]
Measure=String
String=[MeasureMeteoUpdateCheck]
RegExpSubstitute=1
Substitute="^UPDATE\|":"","^CURRENT\|":"","^ERROR\|":""
DynamicVariables=1

[MeasureUpdateScheduler]
Measure=Calc
Formula=(Counter + 1) % #UpdateCheckSeconds#
IfCondition=MeasureUpdateScheduler = 0
IfTrueAction=[!CommandMeasure MeasureMeteoUpdateCheck "Run"]
DynamicVariables=1


; ==================================================
; TREND SYMBOLY
; Lua posiela iba ASCII stav: UP / DOWN / STABLE.
; Samotné Unicode symboly sú definované tu v UTF-16 INI.
; Pri STABLE sa symbol zámerne nezobrazuje.
; ==================================================



[MeasureUVText]
Measure=String
String=#V_UVTextState#
Substitute="LOW":"#L_meteo_uv_low#","MODERATE":"#L_meteo_uv_moderate#","HIGH":"#L_meteo_uv_high#","VERY_HIGH":"#L_meteo_uv_very_high#","EXTREME":"#L_meteo_uv_extreme#"
