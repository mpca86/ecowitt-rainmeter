; ==================================================
; STYLES
; ==================================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1
LeftMouseUpAction=["#EcowittWebUrl#"]
MouseActionCursor=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1
LeftMouseUpAction=["#EcowittWebUrl#"]
MouseActionCursor=1

[styleRightText]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

; ==================================================
; METERS (VIZUÁLNY PANEL)
; ==================================================
LeftMouseUpAction=["#EcowittWebUrl#"]
MouseActionCursor=1

[MeterBackgroundShape]
Meter=Shape
Shape=Rectangle 0,0,200,#V_PanelHeight#,4 | Fill Color 0,0,0,140 | Stroke Color 255,255,255,20
Shape2=Rectangle 10,30,180,1 | Fill Color 255,255,255,30 | Stroke Color 0,0,0,0
Shape3=Rectangle 10,122,180,1 | Fill Color 255,255,255,30 | Stroke Color 0,0,0,0
Shape4=Rectangle 10,#V_BaroSeparatorY#,180,1 | Fill Color 255,255,255,30 | Stroke Color 0,0,0,0
X=0
Y=0
LeftMouseUpAction=["#EcowittWebUrl#"]
MouseActionCursor=1
DynamicVariables=1

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=10
W=190
H=18
Text=#V_TitleText#
FontColor=#V_TitleColor#
ToolTipText="Ecowitt Cloud: #V_CloudStatus#"
DynamicVariables=1
MiddleMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Settings.ini"]

