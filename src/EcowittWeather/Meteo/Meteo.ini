[Metadata]
Name=Ecowitt Illustro Weather
Author=Martin Šturcel (mpca86)
Information=Ecowitt Weather cloud-api branch - Ecowitt Web API v3, dynamic CH1-CH8 layout, UV categories and trends.
License=Creative Commons BY-NC-SA 3.0
Website=https://martinsturcel.sk
Version=1.10.0-cloud-alpha

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

@IncludeVariables=#@#Includes\Variables.inc
@IncludeCloudSecrets=#@#Includes\CloudSecrets.inc

; ==================================================
; MEASURES (SŤAHOVANIE DÁT)
; ==================================================


[MeasureConfigState]
Measure=String
String=#EcowittApplicationKey#|#EcowittApiKey#|#EcowittMac#
IfMatch=^.+\|.+\|.+$
IfMatchAction=[!EnableMeasure MeasureEcowittRaw][!UpdateMeasure MeasureEcowittRaw][!SetVariable V_TitleText "Meteo Cloud"][!SetVariable V_TitleColor "#colorText#"]
IfNotMatchAction=[!DisableMeasure MeasureEcowittRaw][!SetVariable V_TitleText "Nastav Cloud API"][!SetVariable V_TitleColor "#ColorWarning#"]
DynamicVariables=1
UpdateDivider=-1

[MeasureEcowittRaw]
Measure=Plugin
Plugin=WebParser
URL=#EcowittApiBase#?application_key=#EcowittApplicationKey#&api_key=#EcowittApiKey#&mac=#EcowittMac#&call_back=all&temp_unitid=1&pressure_unitid=3&wind_speed_unitid=7&rainfall_unitid=12&solar_irradiance_unitid=16
RegExp=(?siU)^(.*)$
UpdateRate=#CloudRefreshSeconds#
DynamicVariables=1
Disabled=1

[ScriptJSON]
Measure=Script
ScriptFile=#@#Scripts\main_cloud.lua


; ==================================================
; TREND SYMBOLY
; Lua posiela iba ASCII stav: UP / DOWN / STABLE.
; Samotné Unicode symboly sú definované tu v UTF-16 INI.
; Pri STABLE sa symbol zámerne nezobrazuje.
; ==================================================



[MeasureUVText]
Measure=String
String=#V_UVTextState#
Substitute="LOW":"Nízky","MODERATE":"Stredný","HIGH":"Vysoký","VERY_HIGH":"Veľmi vysoký","EXTREME":"Extrémny"
DynamicVariables=1

[MeasureOutTrendSymbol]
Measure=String
String=#V_OutTempTrendState#
Substitute="UP":"▲","DOWN":"▼","STABLE":""
DynamicVariables=1

[MeasureWHTrendSymbol]
