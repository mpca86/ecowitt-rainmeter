<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecowitt Weather Display · DEMO</title><link rel="stylesheet" href="display.css">
<body><main id="display"><header><div><small>ECOWITT WEATHER DISPLAY</small><h1>Poprad · Veľká</h1><p>Aktuálne počasie v mieste merania</p></div><div class="clock"><strong id="clock"></strong><p id="date"></p></div><div class="status"><b>DEMO · SIMULOVANÉ ÚDAJE</b><p id="status" role="status"></p></div></header>
<section class="primary"><article class="temperature"><h2>Vonkajšia teplota</h2><div class="reading"><span id="temp"></span><em>°C</em></div><p id="trend"></p><div class="extremes"><div><label>MIN DNES</label><strong id="min"></strong><span id="mintime"></span></div><div><label>MAX DNES</label><strong id="max"></strong><span id="maxtime"></span></div></div></article><article><h2>Vietor</h2><div class="reading"><span id="wind"></span><em>km/h</em></div><p id="direction"></p><div class="details"><div><label>Aktuálny náraz</label><strong id="gust"></strong></div><div><label>Najvyšší náraz dnes</label><strong id="maxgust"></strong></div></div></article><article><h2>Zrážky dnes</h2><div class="reading"><span id="rain"></span><em>mm</em></div><p id="rainlabel"></p><div class="details"><div><label>Intenzita</label><strong id="rate"></strong></div><div><label>Posledná hodina</label><strong id="hourrain"></strong></div></div></article></section>
<section class="secondary"><article><label>Vlhkosť</label><strong id="humidity"></strong></article><article><label>Atmosférický tlak</label><strong id="pressure"></strong></article><article><label>UV index</label><strong id="uv"></strong></article><article><label>Slnečné žiarenie</label><strong id="solar"></strong></article></section>
<section class="chart"><div class="charthead"><h2>Vývoj teploty <span>· posledných 48 hodín</span></h2><p id="range"></p></div><svg id="chart" viewBox="0 0 1800 210" role="img" aria-label="Graf simulovanej vonkajšej teploty za posledných 48 hodín"></svg></section><footer><span>WS69 + GW3000 · Demonštračná stanica</span><span id="updated"></span></footer></main>
<nav id="controls" aria-label="Ovládanie demo displeja"><select id="scenario" aria-label="Simulované počasie"><option value="day">Deň</option><option value="rain">Dážď</option><option value="night">Noc</option></select><button id="outage">Simulovať výpadok</button><button id="fullscreen">Celá obrazovka</button><span>F: fullscreen · C: ovládanie</span></nav><script type="module" src="display.js"></script></body></html>
