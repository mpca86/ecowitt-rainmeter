name: Desktop Edition Windows build

on:
  push:
    branches: [cloud-api]
    paths:
      - "src/Desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "src/Desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Show selected .NET SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore src/Desktop/EcowittWeather.sln
      - name: Build
        run: dotnet build src/Desktop/EcowittWeather.sln -c Release --no-restore
      - name: Test parser
        run: dotnet run --project src/Desktop/EcowittWeather.SmokeTests -c Release --no-build
      - name: Verify desktop UI theme and mouse gestures
        shell: pwsh
        run: ./src/Desktop/Testing/Assert-ThemeContract.ps1
      - name: Publish portable Windows preview
        run: |
          dotnet publish src/Desktop/EcowittWeather.Desktop/EcowittWeather.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/desktop-win-x64
          Compress-Archive -Path 'dist/desktop-win-x64/*' -DestinationPath 'dist/EcowittWeather-Desktop-preview-win-x64.zip' -Force
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EcowittWeather-Desktop-preview-win-x64
          path: dist/EcowittWeather-Desktop-preview-win-x64.zip
          if-no-files-found: error
          retention-days: 14
