name: Publish Desktop Alpha release

on:
  push:
    branches: [cloud-api]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release(desktop):')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve Desktop version
        id: metadata
        shell: pwsh
        run: |
          $p = [xml](Get-Content src/Desktop/EcowittWeather.Desktop/EcowittWeather.Desktop.csproj -Raw)
          $version = $p.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+-alpha\.\d+$') {
            throw "Desktop release requires explicit alpha version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=desktop-v$version" >> $env:GITHUB_OUTPUT

      - name: Show selected .NET SDK
        run: dotnet --info
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/Desktop/EcowittWeather.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Desktop/EcowittWeather.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/Desktop/EcowittWeather.SmokeTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify desktop UI theme and mouse gestures
        shell: pwsh
        run: ./src/Desktop/Testing/Assert-ThemeContract.ps1

      - name: Package portable Windows x64 build
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/Desktop/EcowittWeather.Desktop/EcowittWeather.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/desktop-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path dist/desktop-win-x64/EcowittWeather.Desktop.exe)) { throw "Missing Desktop executable" }
          $forbidden = Get-ChildItem dist/desktop-win-x64 -Recurse -File | Where-Object { $_.Name -in @('cloud-secrets.dat', 'settings.json', 'CloudSecrets.inc', 'UserVariables.inc') }
          if ($forbidden) { throw "Configuration or secret in Desktop release!" }

          $filename = "EcowittWeather-Desktop-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path 'dist/desktop-win-x64/*' -DestinationPath "dist/$filename" -Force
          $digest = (Get-FileHash "dist/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("dist/$filename.sha256", "$digest  $filename" + [Environment]::NewLine)
          Get-ChildItem dist -File | Select-Object Name,Length

      - name: Publish separate Desktop prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $zip = "dist/EcowittWeather-Desktop-v$env:VERSION-win-x64.zip"
          $sha = "$zip.sha256"
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag already exists: $env:TAG. Refusing to replace published binaries." }
          gh release create $env:TAG $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Ecowitt Weather Desktop v$env:VERSION" --notes-file "packaging/desktop/RELEASE_NOTES.md" --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
