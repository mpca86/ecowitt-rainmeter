name: HostCreators preflight

on:
  pull_request:
    branches:
      - hostcreators-test
  push:
    branches:
      - hostcreators-test

permissions:
  contents: read

jobs:
  preflight:
    name: static-site-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify static site before deploy
        shell: bash
        run: bash deploy/preflight.sh
